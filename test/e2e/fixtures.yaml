# Seeded faults for the Flightbay end-to-end test. Every secret-shaped value
# contains the canary string; the test fails if it appears anywhere in a bundle.
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: Namespace
metadata:
  name: excluded-team
---
apiVersion: v1
kind: Secret
metadata:
  name: checkout-db
  namespace: payments
type: Opaque
stringData:
  username: checkout
  password: FLIGHTBAY-E2E-CANARY-9d2f
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: payments
data:
  DB_HOST: postgres.payments.svc
  API_TOKEN: FLIGHTBAY-E2E-CANARY-9d2f
  app.conf: |
    dsn=postgres://checkout:FLIGHTBAY-E2E-CANARY-9d2f@postgres:5432/orders
    level=debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: app
        image: busybox:1.36
        env:
        - name: DB_PASSWORD
          value: FLIGHTBAY-E2E-CANARY-9d2f
        command: ["sh", "-c"]
        args:
        - |
          echo "Starting checkout version=2.8.1"
          echo '{"level":"info","msg":"connecting to database","trace_id":"a4e98f02"}'
          echo "Authorization: Bearer FLIGHTBAY-E2E-CANARY-9d2f"
          sleep 2
          echo "ERROR database connection timed out host=postgres.payments.svc:5432 trace_id=a4e98f02"
          echo "ERROR database connection timed out host=postgres.payments.svc:5432 trace_id=a4e98f02"
          echo "ERROR database connection timed out host=postgres.payments.svc:5432 trace_id=a4e98f02"
          echo "Process exiting: could not initialise database connection pool"
          exit 1
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: payments
spec:
  selector: {app: checkout}
  ports:
  - port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: inventory
  namespace: payments
  labels: {app: inventory}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: "500"
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-image
  namespace: payments
  labels: {app: bad-image}
spec:
  containers:
  - name: app
    image: registry.invalid/flightbay/does-not-exist:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: healthy
  namespace: payments
  labels: {app: healthy}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "i=0; while true; do echo \"GET /healthz 200 duration=${i}ms\"; i=$((i+1)); sleep 1; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: should-not-appear
  namespace: excluded-team
  labels: {app: secret-project}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo EXCLUDED-NAMESPACE-MARKER; sleep 3600"]
