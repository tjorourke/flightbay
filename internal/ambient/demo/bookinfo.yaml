# Images are the pinned Docker Hub versions used by the validated local demo.
apiVersion: v1
kind: ServiceAccount
metadata: {name: bookinfo-details}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: bookinfo-ratings}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: bookinfo-reviews}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: bookinfo-productpage}
---
apiVersion: v1
kind: Service
metadata: {name: details, labels: {app: details}}
spec: {selector: {app: details}, ports: [{name: http, port: 9080, targetPort: 9080}]}
---
apiVersion: v1
kind: Service
metadata: {name: ratings, labels: {app: ratings}}
spec: {selector: {app: ratings}, ports: [{name: http, port: 9080, targetPort: 9080}]}
---
apiVersion: v1
kind: Service
metadata: {name: reviews, labels: {app: reviews}}
spec: {selector: {app: reviews}, ports: [{name: http, port: 9080, targetPort: 9080}]}
---
apiVersion: v1
kind: Service
metadata: {name: productpage, labels: {app: productpage}}
spec: {selector: {app: productpage}, ports: [{name: http, port: 9080, targetPort: 9080}]}
---
apiVersion: v1
kind: Service
metadata: {name: reviews-v1}
spec: {selector: {app: reviews, version: v1}, ports: [{name: http, port: 9080, targetPort: 9080}]}
---
apiVersion: v1
kind: Service
metadata: {name: reviews-v2}
spec: {selector: {app: reviews, version: v2}, ports: [{name: http, port: 9080, targetPort: 9080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: details-v1}
spec:
  replicas: 1
  selector: {matchLabels: {app: details, version: v1}}
  template:
    metadata: {labels: {app: details, version: v1}}
    spec:
      serviceAccountName: bookinfo-details
      containers:
      - name: details
        image: docker.io/istio/examples-bookinfo-details-v1:1.20.2
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 9080}]
        readinessProbe: {tcpSocket: {port: 9080}, initialDelaySeconds: 3, periodSeconds: 5}
        resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ratings-v1}
spec:
  replicas: 1
  selector: {matchLabels: {app: ratings, version: v1}}
  template:
    metadata: {labels: {app: ratings, version: v1}}
    spec:
      serviceAccountName: bookinfo-ratings
      containers:
      - name: ratings
        image: docker.io/istio/examples-bookinfo-ratings-v1:1.20.2
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 9080}]
        readinessProbe: {tcpSocket: {port: 9080}, initialDelaySeconds: 3, periodSeconds: 5}
        resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: productpage-v1}
spec:
  replicas: 1
  selector: {matchLabels: {app: productpage, version: v1}}
  template:
    metadata: {labels: {app: productpage, version: v1}}
    spec:
      serviceAccountName: bookinfo-productpage
      containers:
      - name: productpage
        image: docker.io/istio/examples-bookinfo-productpage-v1:1.20.2
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 9080}]
        readinessProbe: {tcpSocket: {port: 9080}, initialDelaySeconds: 3, periodSeconds: 5}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
        resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 512Mi}}
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reviews-v1}
spec:
  replicas: 1
  selector: {matchLabels: {app: reviews, version: v1}}
  template:
    metadata: {labels: {app: reviews, version: v1}}
    spec:
      serviceAccountName: bookinfo-reviews
      containers:
      - name: reviews
        image: docker.io/istio/examples-bookinfo-reviews-v1:1.20.2
        imagePullPolicy: IfNotPresent
        env: [{name: LOG_DIR, value: /tmp/logs}]
        ports: [{containerPort: 9080}]
        readinessProbe: {tcpSocket: {port: 9080}, initialDelaySeconds: 5, periodSeconds: 5}
        volumeMounts: [{name: tmp, mountPath: /tmp}, {name: wlp-output, mountPath: /opt/ibm/wlp/output}]
        resources: {requests: {cpu: 25m, memory: 128Mi}, limits: {memory: 1Gi}}
      volumes: [{name: tmp, emptyDir: {}}, {name: wlp-output, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reviews-v2}
spec:
  replicas: 1
  selector: {matchLabels: {app: reviews, version: v2}}
  template:
    metadata: {labels: {app: reviews, version: v2}}
    spec:
      serviceAccountName: bookinfo-reviews
      containers:
      - name: reviews
        image: docker.io/istio/examples-bookinfo-reviews-v2:1.20.2
        imagePullPolicy: IfNotPresent
        env: [{name: LOG_DIR, value: /tmp/logs}]
        ports: [{containerPort: 9080}]
        readinessProbe: {tcpSocket: {port: 9080}, initialDelaySeconds: 5, periodSeconds: 5}
        volumeMounts: [{name: tmp, mountPath: /tmp}, {name: wlp-output, mountPath: /opt/ibm/wlp/output}]
        resources: {requests: {cpu: 25m, memory: 128Mi}, limits: {memory: 1Gi}}
      volumes: [{name: tmp, emptyDir: {}}, {name: wlp-output, emptyDir: {}}]
