apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: reviews-mesh-split}
spec:
  parentRefs: [{group: "", kind: Service, name: reviews, port: 9080}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /}}]
    backendRefs:
    - {name: reviews-v1, port: 9080, weight: 50}
    - {name: reviews-v2, port: 9080, weight: 50}
