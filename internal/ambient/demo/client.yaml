apiVersion: v1
kind: ServiceAccount
metadata: {name: bookinfo-demo-client}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-client}
spec:
  replicas: 1
  selector: {matchLabels: {app: bookinfo-demo-client}}
  template:
    metadata: {labels: {app: bookinfo-demo-client}}
    spec:
      serviceAccountName: bookinfo-demo-client
      automountServiceAccountToken: false
      containers:
      - name: curl
        image: docker.io/curlimages/curl:8.12.1
        command: [sh, -c]
        args: ['while true; do curl -sS --max-time 10 -o /dev/null -w "productpage HTTP %{http_code}\n" http://productpage:9080/productpage || true; sleep 5; done']
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
