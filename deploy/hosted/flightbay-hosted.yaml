# Hosted Flightbay desk behind oauth2-proxy.
#
# The desk listens on 127.0.0.1 inside the pod, so the only way in is through
# the oauth2-proxy sidecar, which authenticates engineers against your OIDC
# provider and sets X-Forwarded-Email and X-Forwarded-Groups. The desk trusts
# those headers and nothing else.
#
# Before applying, fill in the two Secrets (OIDC client and the support age
# identity), the OIDC issuer, the support group and the storage class, and put
# the Service behind your ingress with TLS. Keep EU customer bundles in an EU
# cluster: the data never leaves this namespace's volume.
apiVersion: v1
kind: Namespace
metadata:
  name: flightbay
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flightbay-desk
  namespace: flightbay
automountServiceAccountToken: false # the desk never calls the Kubernetes API
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flightbay-data
  namespace: flightbay
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Gi
  # storageClassName: encrypted-gp3   # use an encrypted class: bundles are customer data
---
apiVersion: v1
kind: Secret
metadata:
  name: flightbay-support-identity
  namespace: flightbay
type: Opaque
stringData:
  # flightbay-desk keygen -o support.key ; paste the file here. Customers
  # encrypt to the matching public key with flightbay collect --encrypt-to.
  support.key: |
    # REPLACE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: flightbay-oauth2-proxy
  namespace: flightbay
type: Opaque
stringData:
  client-id: REPLACE-ME
  client-secret: REPLACE-ME
  cookie-secret: REPLACE-ME-32-BYTES-BASE64 # openssl rand -base64 32 | tr -- '+/' '-_'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flightbay-desk
  namespace: flightbay
  labels: {app: flightbay-desk}
spec:
  replicas: 1 # workspaces live in memory and the data volume is RWO
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: flightbay-desk}
  template:
    metadata:
      labels: {app: flightbay-desk}
    spec:
      serviceAccountName: flightbay-desk
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: desk
          image: ghcr.io/tjorourke/flightbay-desk:latest
          args:
            - serve
            - --listen=127.0.0.1:8080
            - --data-dir=/data
            - --user-header=X-Forwarded-Email
            - --groups-header=X-Forwarded-Groups
            - --support-group=solo-support # REPLACE with your support group
            - --retention=30d # needs sign-off from Legal and Security
            - --identity=/secrets/support.key
            - --region=eu-west-2
            - --max-log-lines=20000000
          env:
            - {name: FLIGHTBAY_HOME, value: /home/flightbay/.flightbay}
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {memory: 24Gi} # about 400 bytes per indexed log line per open workspace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: home, mountPath: /home/flightbay}
            - {name: identity, mountPath: /secrets, readOnly: true}
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8080/
            - --provider=oidc
            - --oidc-issuer-url=https://sso.example.com/realms/solo # REPLACE
            - --email-domain=*
            - --allowed-group=solo-support # REPLACE; per-case ACLs live in the desk
            - --oidc-groups-claim=groups
            - --pass-user-headers=true # X-Forwarded-Email, X-Forwarded-Groups
            - --skip-jwt-bearer-tokens=true # lets `flightbay upload --token` use an OIDC token
            - --cookie-secure=true
            - --cookie-samesite=strict
            - --reverse-proxy=true
            - --upstream-timeout=30m # long uploads
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: flightbay-oauth2-proxy, key: client-id}}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: flightbay-oauth2-proxy, key: client-secret}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: flightbay-oauth2-proxy, key: cookie-secret}}
          ports:
            - {name: http, containerPort: 4180}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: flightbay-data}
        - name: home
          emptyDir: {}
        - name: identity
          secret: {secretName: flightbay-support-identity, defaultMode: 0400}
---
apiVersion: v1
kind: Service
metadata:
  name: flightbay-desk
  namespace: flightbay
spec:
  selector: {app: flightbay-desk}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Ingress only to oauth2-proxy; egress only to DNS and HTTPS (the OIDC issuer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flightbay-desk
  namespace: flightbay
spec:
  podSelector:
    matchLabels: {app: flightbay-desk}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 4180, protocol: TCP}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 443, protocol: TCP}
