# goreleaser v2: the collector (flightbay). It is pure Go and static, so one
# runner builds every OS and architecture. The desk links DuckDB through cgo
# and is built natively per platform by .github/workflows/release.yml.
version: 2
project_name: flightbay

env:
  - TAP_GITHUB_TOKEN={{ if index .Env "TAP_GITHUB_TOKEN" }}{{ .Env.TAP_GITHUB_TOKEN }}{{ end }}

before:
  hooks:
    - go mod tidy

builds:
  - id: flightbay
    main: ./cmd/flightbay
    binary: flightbay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    hooks:
      # Every bundle records the SHA-256 of the binary that wrote it
      # (collectorSha256). Publishing the binaries' own hashes, covered by the
      # signed checksum file, lets either side match a bundle to a release.
      post:
        - sh -c 'printf "%s  %s\n" "$(shasum -a 256 "{{ .Path }}" | cut -d" " -f1)" "{{ .Os }}_{{ .Arch }}/{{ .Name }}" >> dist/binaries-flightbay.sha256'

archives:
  - id: flightbay
    ids: [flightbay]
    name_template: "flightbay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, docs/COLLECTS.md]

checksum:
  name_template: checksums-flightbay.txt
  extra_files:
    - glob: dist/binaries-flightbay.sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum

homebrew_casks:
  - name: flightbay
    ids: [flightbay]
    # Published only when TAP_GITHUB_TOKEN (a token that can push to the tap) is set.
    repository: {owner: tjorourke, name: homebrew-tap, token: "{{ .Env.TAP_GITHUB_TOKEN }}"}
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    homepage: https://github.com/tjorourke/flightbay
    description: Capture an offline, redacted snapshot of Kubernetes clusters

krews:
  - name: flightbay
    ids: [flightbay]
    repository: {owner: tjorourke, name: krew-index, token: "{{ .Env.TAP_GITHUB_TOKEN }}"}
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    homepage: https://github.com/tjorourke/flightbay
    short_description: Capture a redacted, offline Kubernetes snapshot
    description: |
      kubectl flightbay collect writes a redacted tar.zst bundle of the objects,
      logs, events and (optionally) Solo proxy and control-plane diagnostics you
      choose. Secret values are never collected. Open it with flightbay-desk.
    caveats: |
      Review a bundle before sending it:
        kubectl flightbay inspect BUNDLE --contents --redactions

release:
  github: {owner: tjorourke, name: flightbay}
  extra_files:
    - glob: dist/binaries-flightbay.sha256
  draft: true
  mode: keep-existing
