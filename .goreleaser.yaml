# goreleaser v2: the collector (flightbay). It is pure Go and static, so one
# runner builds every OS and architecture. The desk links DuckDB through cgo
# and is built natively per platform by .github/workflows/release.yml.
version: 2
project_name: flightbay

before:
  hooks:
    - go mod tidy

builds:
  - id: flightbay
    main: ./cmd/flightbay
    binary: flightbay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: flightbay
    ids: [flightbay]
    name_template: "flightbay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, docs/COLLECTS.md]

checksum:
  name_template: checksums-flightbay.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum

homebrew_casks:
  - name: flightbay
    ids: [flightbay]
    repository: {owner: tjorourke, name: homebrew-tap}
    homepage: https://github.com/tjorourke/flightbay
    description: Capture an offline, redacted snapshot of Kubernetes clusters

krews:
  - name: flightbay
    ids: [flightbay]
    repository: {owner: tjorourke, name: krew-index}
    homepage: https://github.com/tjorourke/flightbay
    short_description: Capture a redacted, offline Kubernetes snapshot
    description: |
      kubectl flightbay collect writes a redacted tar.zst bundle of the objects,
      logs, events and (optionally) Solo proxy and control-plane diagnostics you
      choose. Secret values are never collected. Open it with flightbay-desk.
    caveats: |
      Review a bundle before sending it:
        kubectl flightbay inspect BUNDLE --contents --redactions

release:
  github: {owner: tjorourke, name: flightbay}
  draft: true
  mode: keep-existing
