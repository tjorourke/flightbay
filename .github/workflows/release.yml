name: release
on:
  push: {tags: ["v*"]}
permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign
jobs:
  collector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with: {version: "~> v2", args: release --clean}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", TAP_GITHUB_TOKEN: "${{ secrets.TAP_GITHUB_TOKEN }}"}

  desk:
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, goos: linux, goarch: amd64}
          - {os: ubuntu-24.04-arm, goos: linux, goarch: arm64}
          - {os: macos-14, goos: darwin, goarch: arm64}
          - {os: macos-15-intel, goos: darwin, goarch: amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: sigstore/cosign-installer@v3
      - name: build
        run: |
          V=${GITHUB_REF_NAME#v}
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=$V" -o dist/flightbay-desk ./cmd/flightbay-desk
          A=flightbay-desk_${V}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          tar -czf "$A" -C dist flightbay-desk -C .. README.md LICENSE NOTICE
          shasum -a 256 "$A" > "$A.sha256"
          cosign sign-blob --yes --output-signature "$A.sig" --output-certificate "$A.pem" "$A"
          # Compile/sign in parallel with the collector; only uploading needs
          # the release it creates. Fail if it never becomes available.
          ready=false
          for attempt in $(seq 1 120); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          gh release upload "$GITHUB_REF_NAME" "$A" "$A.sha256" "$A.sig" "$A.pem" --clobber
        env: {GH_TOKEN: "${{ github.token }}"}

  homebrew:
    needs: [collector, desk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: update formula from published archives
        run: |
          python3 scripts/update-homebrew.py --version "$GITHUB_REF_NAME"
          git add Formula/flightbay.rb
          if ! git diff --cached --quiet; then
            git commit -m "Homebrew: publish $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

  image:
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, arch: amd64}
          - {os: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/flightbay-desk:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=desk-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=desk-image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/flightbay-desk@${{ steps.build.outputs.digest }}

  image-manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: publish and sign the multi-platform image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/flightbay-desk
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          cosign sign --yes "$IMAGE@$DIGEST"
