name: release
on:
  push: {tags: ["v*"]}
permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign
jobs:
  collector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with: {version: "~> v2", args: release --clean}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  desk:
    needs: collector
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, goos: linux, goarch: amd64}
          - {os: ubuntu-24.04-arm, goos: linux, goarch: arm64}
          - {os: macos-14, goos: darwin, goarch: arm64}
          - {os: macos-15-intel, goos: darwin, goarch: amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: sigstore/cosign-installer@v3
      - name: build
        run: |
          V=${GITHUB_REF_NAME#v}
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=$V" -o dist/flightbay-desk ./cmd/flightbay-desk
          A=flightbay-desk_${V}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          tar -czf "$A" -C dist flightbay-desk -C .. README.md
          shasum -a 256 "$A" > "$A.sha256"
          cosign sign-blob --yes --output-signature "$A.sig" --output-certificate "$A.pem" "$A"
          gh release upload "$GITHUB_REF_NAME" "$A" "$A.sha256" "$A.sig" "$A.pem" --clobber
        env: {GH_TOKEN: "${{ github.token }}"}

  image:
    needs: collector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/flightbay-desk:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/flightbay-desk:latest
          provenance: mode=max
          sbom: true
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/flightbay-desk@${{ steps.build.outputs.digest }}
