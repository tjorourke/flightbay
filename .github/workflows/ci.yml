name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: reject unapproved capture archives
        run: test "$(git ls-files '*.tar.zst' '*.tar.zst.age' | sort)" = "examples/sample-bundle.tar.zst"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: map connector routing and JavaScript syntax
        run: |
          node --test test/*.test.cjs
          for file in web/*.js; do node --check "$file"; done
      - name: collector builds static
        run: CGO_ENABLED=0 go build -o /tmp/flightbay ./cmd/flightbay
      - name: desk builds
        run: go build -o /tmp/flightbay-desk ./cmd/flightbay-desk && /tmp/flightbay-desk version
      - name: sample bundle opens and verifies
        run: |
          /tmp/flightbay inspect examples/sample-bundle.tar.zst | grep -q "Verified: yes"

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with: {hugo-version: "0.160.0", extended: true}
      - name: build documentation site
        run: hugo --source docs/site --destination /tmp/flightbay-docs
      - name: validate Homebrew formula
        run: ruby -c Formula/flightbay.rb
